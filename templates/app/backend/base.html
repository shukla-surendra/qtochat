{% load static %}

<!DOCTYPE html>
<!--
This is a starter template page. Use this page to start your new project from
scratch. This page gets rid of all links and provides the needed markup only.
-->
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{title}}</title>


  <!-- Tell the browser to be responsive to screen width -->
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
  <link rel="stylesheet" href="{% static 'backend/bower_components/bootstrap/dist/css/bootstrap.min.css' %}">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{% static 'backend/bower_components/font-awesome/css/font-awesome.min.css' %}">
  <!-- Ionicons -->
  <link rel="stylesheet" href="{% static 'backend/bower_components/Ionicons/css/ionicons.min.css' %}">

  <link rel="stylesheet" href="{% static 'backend/bower_components/bootstrap-daterangepicker/daterangepicker.css' %}">

  <!-- Theme style -->
  <link rel="stylesheet" href="{% static 'backend/dist/css/AdminLTE.min.css' %}">
  <!-- AdminLTE Skins. We have chosen the skin-blue for this starter
        page. However, you can choose any other skin. Make sure you
        apply the skin class to the body tag so the changes take effect. -->
  <link rel="stylesheet" href="{% static 'backend/dist/css/skins/skin-purple.min.css' %}">
  <link rel="stylesheet" href="{% static 'backend/bower_components/select2/dist/css/select2.min.css' %}">
  <!-- Bootstrap Color Picker -->
  <link rel="stylesheet" href="{% static 'backend/bower_components/bootstrap-colorpicker/dist/css/bootstrap-colorpicker.min.css' %}">
  <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
  <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
  <!--[if lt IE 9]>
  <script src="https://oss.maxcdn.com/html5shiv/3.7.3/html5shiv.min.js"></script>
  <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
  <![endif]-->

  <!-- bootstrap datepicker -->
  <link rel="stylesheet" href="{% static 'backend/bower_components/bootstrap-datepicker/dist/css/bootstrap-datepicker.min.css' %}">
  <!-- iCheck for checkboxes and radio inputs -->
  <link rel="stylesheet" href="{% static 'backend/plugins/iCheck/all.css' %}">
  <!-- Bootstrap Color Picker -->
  <link rel="stylesheet" href="{% static 'backend/bower_components/bootstrap-colorpicker/dist/css/bootstrap-colorpicker.min.css' %}">
  <!-- Bootstrap time Picker -->
  <link rel="stylesheet" href="{% static 'backend/plugins/timepicker/bootstrap-timepicker.min.css' %}">
  <!-- Normalizer -->
  <link rel="stylesheet" href="{% static 'backend/dist/css/custom.css' %}">


  <!-- Google Font -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,300italic,400italic,600italic">
</head>
<!--
BODY TAG OPTIONS:
=================
Apply one or more of the following classes to get the
desired effect
|---------------------------------------------------------|
| SKINS         | skin-blue                               |
|               | skin-black                              |
|               | skin-purple                             |
|               | skin-yellow                             |
|               | skin-red                                |
|               | skin-green                              |
|---------------------------------------------------------|
|LAYOUT OPTIONS | fixed                                   |
|               | layout-boxed                            |
|               | layout-top-nav                          |
|               | sidebar-collapse                        |
|               | sidebar-mini                            |
|---------------------------------------------------------|
-->

<body class="hold-transition skin-purple sidebar-mini">


  {% block content %} {% endblock %}

  <!-- REQUIRED JS SCRIPTS -->

  <!-- jQuery 3 -->
  <script src="{% static 'backend/bower_components/jquery/dist/jquery.min.js' %}"></script>
  <!-- Bootstrap 3.3.7 -->
  <script src="{% static 'backend/bower_components/bootstrap/dist/js/bootstrap.min.js' %}"></script>
  <!-- FastClick -->
  <script src="{% static 'backend/bower_components/fastclick/lib/fastclick.js' %}"></script>
  <!-- AdminLTE App -->

  <!--  Date range picker-->
  <script src="{% static 'backend/bower_components/moment/min/moment.min.js' %}"></script>
  <script src="{% static 'backend/bower_components/bootstrap-daterangepicker/daterangepicker.js' %}"></script>
  <!-- bootstrap datepicker -->
  <script src="{% static 'backend/bower_components/bootstrap-datepicker/dist/js/bootstrap-datepicker.min.js' %}"></script>
  <!-- bootstrap color picker -->
  <script src="{% static 'backend/bower_components/bootstrap-colorpicker/dist/js/bootstrap-colorpicker.min.js' %}"></script>
  <!-- bootstrap time picker -->
  <script src="{% static 'backend/plugins/timepicker/bootstrap-timepicker.min.js' %}"></script>

  <script src="{% static 'backend/dist/js/adminlte.min.js' %}"></script>
  <!-- Sparkline -->
  <script src="{% static 'backend/bower_components/jquery-sparkline/dist/jquery.sparkline.min.js' %}"></script>
  <!-- jvectormap  -->
  <script src="{% static 'backend/plugins/jvectormap/jquery-jvectormap-1.2.2.min.js' %}"></script>
  <script src="{% static 'backend/plugins/jvectormap/jquery-jvectormap-world-mill-en.js' %}"></script>
  <!-- SlimScroll -->
  <script src="{% static 'backend/bower_components/jquery-slimscroll/jquery.slimscroll.min.js' %}"></script>
  <!-- ChartJS -->
  <script src="{% static 'backend/bower_components/chart.js/Chart.js' %}"></script>
  <!-- AdminLTE dashboard demo (This is only for demo purposes) -->
  <script src="{% static 'backend/dist/js/custom-chart.js' %}"></script>
  <!-- AdminLTE for demo purposes -->
  <!-- bootstrap color picker -->
  <script src="{% static 'backend/bower_components/bootstrap-colorpicker/dist/js/bootstrap-colorpicker.min.js' %}"></script>

  <script src="{% static 'backend/dist/js/custom.js' %}"></script>
</body>

</html>
