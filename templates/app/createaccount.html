<link href="https://fonts.googleapis.com/css?family=Lato:200,300,400,400i,500,600,700%7CMerriweather:300,300i" rel="stylesheet">

<link href="https://fortawesome.github.io/Font-Awesome/assets/font-awesome/css/font-awesome.css" rel="stylesheet">

{% block content %}

    
<div class="main-container">
    <section class="height-100 imagebg text-center" data-overlay="4">
       
        <div class="container pos-vertical-center">
            <div class="row">
                <div class="col-sm-7 col-md-5">
                    <h2>Register</h2>
                    <p class="">
                        Register to get your own AI powered chatbot for your website
                    </p>
                    <p style="color:white">{{response}} </p>
                    <form action="" method="post" id="signupForm">

                            {% csrf_token %}
                           <div class="row">
                                <div class="col-sm-12">
                                    <label for="url">Your Website: </label>
                                    <input id="upwebsite" class="round" type="url" name="url" placeholder="Website" />
                               </div>

                            <div class="col-sm-12">
                                <label for="your_name">Your name: </label>
                                <input type="text" class="round" id="upname" name="name" placeholder="Your Full Name" />
                            </div>

                            <div class="col-sm-12">
                                    <label class="mbr-primary" for="email">Your Email: </label>
                                    <input type="email" class="round " id="upemail" name="email" placeholder="Email" />
                            </div>

                            <div class="col-sm-12">
                                <label for="password">Your Password: </label>
                                <input type="password" name="password" class="round" id="uppassword" placeholder="Password" />
                            </div>
                            <div class="col-sm-12">
                                <button class="btn btn--primary type--uppercase" type="submit">Create Account</button>
                            </div>
                        </div>
                
                    </form>
                    <span class="type--fine-print block">Have an account already?
                        <a href="{% url 'login' %}">Login</a>
                    </span>
                    <span class="type--fine-print block">
                            <a href="{% url 'recover' %}">Forgot your password</a>
                        </span>
                    
                </div>
            </div>
            <!--end of row-->
        </div>
        <!--end of container-->
    </section>
</div>
{%endblock%}
