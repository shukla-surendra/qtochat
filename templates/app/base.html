<!doctype html>
{% load staticfiles %}
<html lang="en">
<head>
    <title>{{ title }}</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Mobland - Mobile App Landing Page Template">
    <meta name="keywords" content="HTML5, bootstrap, mobile, app, landing, ios, android, responsive">

    <!-- Font -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css?family=Rubik:300,400,500" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <!-- Themify Icons -->
    <link rel="stylesheet" href="{% static 'css/themify-icons.css' %}">
    <!-- Owl carousel -->
    <link rel="stylesheet" href="{% static 'css/owl.carousel.min.css' %}">
    <!-- extra css -->
    <link rel="stylesheet" href="{% static 'css/extra.css' %}">
    <!-- Main css -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <!-- chat widget css-->
    <link href="{% static 'css/widget_style.css' %}" rel="stylesheet">
</head>

<body data-spy="scroll" data-target="#navbar" data-offset="30">
  

{% block content %}
{% endblock %}
    <footer class="my-5 text-center">
        <!-- Copyright removal is not prohibited! -->
        <p class="mb-2"><small>COPYRIGHT © 2017. ALL RIGHTS RESERVED. MOBAPP TEMPLATE BY <a href="https://colorlib.com">COLORLIB</a></small></p>

        <small>
            <a href="#" class="m-2">PRESS</a>
            <a href="#" class="m-2">TERMS</a>
            <a href="#" class="m-2">PRIVACY</a>
        </small>
    </footer>

    <!-- jQuery and Bootstrap -->
    <script src="{% static 'js/jquery-3.2.1.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <!-- Plugins JS -->
    <script src="{% static 'js/owl.carousel.min.js' %}"></script>
    <!-- Custom JS -->
    <script src="{% static 'js/script.js' %}"></script>
    <script src="{% static 'js/site.js' %}"></script>
    <script type="text/javascript" src="{% static 'vendors/chart.js-2.7.2/dist/Chart.min.js' %}"></script>
    <script src="{% static 'vendors/jquery-validation/dist/jquery.validate.min.js' %}"></script>
    <script src="{% static 'js/validation.js' %}"></script>
<script type="text/javascript">

var ctx = document.getElementById("qtoChatAnalytics").getContext('2d');

{% for campaign in campaigns %}
new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ["Unique Visitor", "Returned Visitor"],
      datasets: [{
        label: "Population (millions)",
        backgroundColor: ["#3e95cd", "#8e5ea2"],
        data: [{{campaign.unique_hits}},{{campaign.hits_count}}-{{campaign.unique_hits}}]
      }]
    },
    options: {
      title: {
        display: true,
        text: 'From total hists {{campaign.hits_count}}'
      }
    }
});


{% endfor %}



</script>

</body>

</html>
